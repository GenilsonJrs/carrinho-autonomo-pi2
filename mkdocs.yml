site_name: Wall-Eight · Carrinho Autônomo
site_description: Robô móvel de transporte de carga com ESP32-S3, tração diferencial e controle de rumo em malha fechada. Projeto Integrador 2 — UnB/FGA.
site_author: Genilson Silva de Araújo Júnior
site_url: https://genilsonjrs.github.io/carrinho-autonomo-pi2/
repo_url: https://github.com/GenilsonJrs/carrinho-autonomo-pi2
repo_name: GenilsonJrs/carrinho-autonomo-pi2
edit_uri: edit/main/docs/
copyright: Genilson Silva de Araújo Júnior · Grupo 8, PI2 — FGA/UnB

theme:
  name: material
  language: pt-BR
  favicon: assets/favicon.svg
  icon:
    logo: material/robot-mower
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para o tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para o tema claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: pt

nav:
  - Início: index.md
  - O robô:
      - Arquitetura: arquitetura.md
      - Firmware da escrava: firmware/escrava.md
      - Firmware da mestre: firmware/mestre.md
      - Interface e rotas: interface.md
  - Hardware:
      - Pinagem completa: hardware.md
      - Ligações da escrava: ligacoes.md
  - Compilar e gravar: compilar.md
